name: nexora
description: "Nexora — Connect with experts, powered by AI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Navigation
  go_router: ^14.2.7

  # State Management
  flutter_riverpod: ^2.5.1

  # HTTP & Networking
  dio: ^5.6.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.1

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5

  # Native OAuth
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^6.0.4

  # QR code display (2FA setup)
  qr_flutter: ^4.1.0

  # Image picking for avatar upload
  image_picker: ^1.1.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Real-time WebSocket (Laravel Reverb)
  web_socket_channel: ^3.0.1

  # Connectivity
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.0

  # Audio recording + playback
  flutter_sound: ^9.18.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
