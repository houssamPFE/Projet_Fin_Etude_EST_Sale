services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexora_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./backend/docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - nexora
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: nexora_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - nexora
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: nexora_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nexora}
      MYSQL_USER: ${DB_USERNAME:-nexora}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nexora

  redis:
    image: redis:7-alpine
    container_name: nexora_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexora

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexora_reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    ports:
      - "8080:8080"
    networks:
      - nexora
    depends_on:
      - mysql
      - redis

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexora_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=120 --sleep=1
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    networks:
      - nexora
    depends_on:
      - mysql
      - redis

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexora_scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do php artisan schedule:run; sleep 60; done"
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    networks:
      - nexora
    depends_on:
      - mysql
      - redis

  n8n:
    image: n8nio/n8n:latest
    container_name: nexora_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://n8n:5678
      # Shared secret — must match N8N_SECRET in Laravel .env
      - N8N_SECRET=${N8N_SECRET:-change-me-in-production}
      # Laravel callback base URL (internal Docker network)
      - LARAVEL_URL=http://nginx:80
      # LLM — Groq (free) by default; swap for OpenAI by changing these two lines
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_BASE_URL=https://api.groq.com/openai/v1
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      # Qdrant (vector search) — internal Docker network
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-nexora_knowledge}
      # n8n persistence & execution settings
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      # Allow Code nodes to read environment variables via $env.*
      - NODE_FUNCTION_ALLOW_ENV=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows:ro
    networks:
      - nexora
    depends_on:
      - nginx
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: nexora_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - nexora

  minio:
    image: minio/minio:latest
    container_name: nexora_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - nexora

  minio-init:
    image: minio/mc:latest
    container_name: nexora_minio_init
    depends_on:
      - minio
    networks:
      - nexora
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin}) do echo 'Waiting for MinIO...'; sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/${AWS_BUCKET:-nexora};
      /usr/bin/mc anonymous set download local/${AWS_BUCKET:-nexora};
      echo 'MinIO bucket ready';
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: nexora_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - nexora

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: nexora_phpmyadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: nexora
      PMA_PASSWORD: secret
    networks:
      - nexora
    depends_on:
      - mysql

networks:
  nexora:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  n8n_data:
  qdrant_data:
  minio_data:
